<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Clean codebase report</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2230; --muted: #5d6675; --line: #e2e6ec;
    --accent: #2f6fed; --accent-ink: #ffffff; --soft: #eef3ff;
    --ok: #1f8a4c; --ok-soft: #e6f5ec; --warn: #b3660b; --warn-soft: #fff4e3; --neutral-soft: #f1f3f6;
    --bad: #c23b32; --bad-soft: #fbe9e7;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --ink: #e8ebf0; --muted: #98a2b3; --line: #2a3140;
      --accent: #7aa2ff; --accent-ink: #0f1218; --soft: #1c2740;
      --ok: #5fcf8a; --ok-soft: #14301f; --warn: #f0b35a; --warn-soft: #3a2a10; --neutral-soft: #1f2530;
      --bad: #f07a70; --bad-soft: #3a2220;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b23; --ink: #e8ebf0; --muted: #98a2b3; --line: #2a3140;
    --accent: #7aa2ff; --accent-ink: #0f1218; --soft: #1c2740;
    --ok: #5fcf8a; --ok-soft: #14301f; --warn: #f0b35a; --warn-soft: #3a2a10; --neutral-soft: #1f2530;
    --bad: #f07a70; --bad-soft: #3a2220;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); padding: 0 20px 64px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { padding: 24px 0 8px; }
  .new { color: var(--muted); font-size: 13px; margin: 0; }
  .sum { font-size: 22px; line-height: 1.3; margin: 8px 0 4px; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 13px; margin: 0; }
  .warn { color: var(--warn); font-size: 13px; margin: 6px 0 0; }
  .box { background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 14px 0; }
  .box h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .box ul { margin: 0; padding-left: 20px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
  .ft-f { font: 500 12.5px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 3px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .ft-f[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
  .ft-f[disabled] { opacity: .45; cursor: default; }
  .ft-f b { font-weight: 600; }
  section { margin: 0 0 20px; }
  section h2 { font-size: 17px; margin: 0 0 8px; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; background: var(--neutral-soft); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--neutral-soft); }
  tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.row td:first-child { border-left: 3px solid transparent; white-space: nowrap; }
  tr.row td:first-child::before { content: "▸"; color: var(--muted); font-size: 11px; display: inline-block; width: 14px; transition: transform .15s; }
  tr.row.open td:first-child::before { transform: rotate(90deg); }
  tr.row.choice td:first-child { border-left-color: var(--accent); }
  tr.row.choice td { background: var(--soft); }
  td.num { font-family: var(--mono); color: var(--muted); width: 70px; }
  .name { font-weight: 600; }
  .tag { display: inline-block; margin: 0 0 0 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--neutral-soft); color: var(--muted); }
  .tag.choice { background: var(--accent); color: var(--accent-ink); }
  .tag.back { background: var(--bad-soft); color: var(--bad); }
  .tag.known { background: var(--ok-soft); color: var(--ok); }
  .advice { font-size: 12.5px; font-weight: 600; }
  .advice.fix { color: var(--bad); }
  .advice.keep-and-mark { color: var(--warn); }
  .advice.fine { color: var(--ok); }
  tr.places td { background: var(--bg); padding: 8px 14px 12px 32px; }
  .place { margin: 4px 0; font-size: 13.5px; }
  .place code { font-family: var(--mono); font-size: 12.5px; background: var(--neutral-soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  .place .how { color: var(--muted); }
  .place .mark { color: var(--accent); font-weight: 600; font-size: 12px; margin-left: 6px; }
  .tag.strong { background: var(--ok-soft); color: var(--ok); }
  .tag.worth { background: var(--warn-soft); color: var(--warn); }
  .tag.spec { background: var(--neutral-soft); color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; margin: 0 0 16px; }
  .card.choice { border-left-color: var(--accent); background: var(--soft); }
  .card h3 { display: inline; font-size: 16px; margin: 0 0 0 8px; }
  .card p { margin: 8px 0; }
  .card .solution { color: var(--muted); }
  .diagrams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .diagrams figure { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; overflow-x: auto; background: var(--bg); }
  .diagrams figcaption { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin: 0 0 6px; }
  .diagrams pre { margin: 0; }
  .card ul.wins { margin: 8px 0; padding-left: 20px; }
  .adr { background: var(--warn-soft); border-radius: var(--radius); padding: 6px 10px; }
  @media (max-width: 720px) { .diagrams { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {};
</script>

<script>
(function () {
  'use strict';
  const el = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      if (attrs[k] == null) continue;
      if (k === 'class') e.className = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  };
  const ADVICE = { fix: 'Fix', 'keep-and-mark': 'Keep and mark', fine: 'Not a bad example' };
  const FILTERS = [
    ['all', 'All', () => true],
    ['fix', 'Fix', (r) => r.advice === 'fix'],
    ['keep-and-mark', 'Keep and mark', (r) => r.advice === 'keep-and-mark'],
    ['fine', 'Not a bad example', (r) => r.advice === 'fine'],
    ['choice', 'Your choice', (r) => r.choice],
  ];
  const rows = DATA.rows || [];
  const app = document.getElementById('app');
  let filter = 'all';

  const adviceSpan = (r) => el('span', { class: 'advice ' + r.advice }, ADVICE[r.advice]);
  const rowTags = (r) => {
    const tags = [];
    if (r.choice) tags.push(el('span', { class: 'tag choice' }, 'Your choice'));
    if (r.state === 'known') tags.push(el('span', { class: 'tag known' }, 'Known ' + r.ticket));
    if (r.state === 'came-back') tags.push(el('span', { class: 'tag back' }, 'Came back ' + r.ticket));
    return tags;
  };
  const placeLine = (p) => el('div', { class: 'place' },
    el('code', {}, p.at), el('code', {}, p.text),
    el('span', { class: 'how' }, p.label + ': ' + p.proof),
    p.new ? el('span', { class: 'mark' }, 'new') : null);
  const section = (title, list, drawItems) => {
    const shown = list.filter(FILTERS.find((f) => f[0] === filter)[2]);
    if (!shown.length) return null;
    return el('section', {}, el('h2', {}, title), drawItems(shown));
  };

  const rowLines = (r) => {
    const head = el('tr', { class: 'row' + (r.choice ? ' choice' : ''), 'data-id': r.id,
      tabindex: '0', 'aria-expanded': 'false' },
      el('td', {}, adviceSpan(r)),
      el('td', {}, el('span', { class: 'name' }, r.name), rowTags(r)),
      el('td', {}, r.reason),
      el('td', { class: 'num' }, r.count));
    const places = el('tr', { class: 'places', hidden: '' },
      el('td', { colspan: '4' }, r.places.map(placeLine)));
    const toggle = () => {
      places.hidden = !places.hidden;
      head.classList.toggle('open', !places.hidden);
      head.setAttribute('aria-expanded', String(!places.hidden));
    };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    return [head, places];
  };

  const table = (title, list) => section(title, list, (shown) =>
    el('div', { class: 'tablewrap' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Advice'), el('th', {}, 'Name'), el('th', {}, 'Reason'), el('th', {}, 'Places'))),
      el('tbody', {}, shown.map(rowLines)))));

  const BADGE = { Strong: 'strong', 'Worth exploring': 'worth', Speculative: 'spec' };
  const kindTitle = (id) => ((DATA.kinds || []).find((k) => k.id === id) || {}).title || id;
  const diagram = (caption, source) => {
    const pre = el('pre', { class: 'mermaid' });
    pre.textContent = source;
    return el('figure', {}, el('figcaption', {}, caption), pre);
  };
  const cardOf = (r) => {
    const c = r.card;
    return el('article', { class: 'card' + (r.choice ? ' choice' : ''), 'data-id': r.id },
      el('div', {}, adviceSpan(r), el('h3', {}, r.name), rowTags(r),
        el('span', { class: 'tag ' + BADGE[c.badge] }, c.badge),
        c.tag ? el('span', { class: 'tag' }, c.tag) : null,
        el('span', { class: 'tag' }, kindTitle(r.kind))),
      el('p', {}, r.reason),
      c.solution ? el('p', { class: 'solution' }, c.solution) : null,
      el('div', { class: 'diagrams' }, diagram('Before', c.before), diagram('After', c.after)),
      (c.wins || []).length ? el('ul', { class: 'wins' }, c.wins.map((w) => el('li', {}, w))) : null,
      c.adr ? el('p', { class: 'adr' }, c.adr) : null,
      el('div', {}, r.places.map(placeLine)));
  };
  const cards = (title, list) => section(title, list, (shown) => el('div', {}, shown.map(cardOf)));

  let mermaid = null;
  const paint = () => {
    if (mermaid) mermaid.run({ nodes: app.querySelectorAll('pre.mermaid:not([data-processed])') });
  };
  if (DATA.view === 'cards') {
    import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then((m) => {
      mermaid = m.default;
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
      paint();
    });
  }

  const draw = () => {
    app.innerHTML = '';
    app.append(el('header', {},
      el('p', { class: 'new' }, 'New means: ' + DATA.new + '.'),
      el('p', { class: 'sum' }, DATA.summary),
      el('p', { class: 'meta' }, [DATA.skill, DATA.repo, DATA.scope, DATA.commit, DATA.date].join(' · ')),
      DATA.tickets !== 'checked' ? el('p', { class: 'warn' }, 'Tickets ' + DATA.tickets) : null));
    if ((DATA.changes || []).length) {
      app.append(el('div', { class: 'box' }, el('h2', {}, 'The change list will hold'),
        el('ul', {}, DATA.changes.map((c) => el('li', {}, c)))));
    }
    if (!rows.length) return;
    app.append(el('div', { class: 'filters' }, FILTERS.map(([key, word, test]) => {
      const n = rows.filter(test).length;
      return el('button', { class: 'ft-f', 'aria-pressed': String(filter === key), disabled: n ? null : '',
        onclick: () => { filter = key; draw(); } }, el('b', {}, n), word);
    })));
    const spreading = rows.filter((r) => r.spreading);
    const rest = rows.filter((r) => !r.spreading);
    const sections = [];
    if (DATA.view === 'cards') {
      sections.push(cards('Still spreading', spreading), cards('Candidates', rest));
    } else {
      sections.push(table('Still spreading', spreading));
      for (const kind of DATA.kinds || []) sections.push(table(kind.title, rest.filter((r) => r.kind === kind.id)));
    }
    app.append(...sections.filter(Boolean));
    paint();
  };
  draw();
})();
</script>
</body>
</html>
