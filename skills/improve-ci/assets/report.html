<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CI review: {{repo name}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light dark; --bg: #fafaf9; --fg: #0f172a; --card: #ffffff; --line: #e2e8f0; --muted: #64748b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #e7e5e4; --card: #1c1917; --line: #292524; --muted: #a8a29e; }
  }
  body { background: var(--bg); color: var(--fg); }
  .card { background: var(--card); border-color: var(--line); }
  .muted { color: var(--muted); }
  table td, table th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
</style>
</head>
<body>
<main class="max-w-5xl mx-auto px-6 py-12 space-y-12">
  <header>
    <h1 class="font-serif text-3xl">CI review: {{repo name}}</h1>
    <p class="font-mono text-sm">{{runs read}} · {{from}} to {{to}} · {{date}}</p>
    <p class="font-mono text-sm">PR result: p50 {{pr p50}} · p95 {{pr p95}}</p>
  </header>
  <section id="timing"></section>
  <section id="finds" class="space-y-10">
    <article class="card rounded-xl border p-6">
      <h2 class="font-serif text-2xl">Example: replace this card</h2>
    </article>
  </section>
  <section id="small" class="space-y-8"></section>
  <section id="top-pick"></section>
</main>
</body>
</html>
