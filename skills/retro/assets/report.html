<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Retro report: {{repo name}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light dark; --bg: #fafaf9; --fg: #0f172a; --card: #ffffff; --line: #e2e8f0; --muted: #64748b; --quote: #f5f5f4; --accent: #059669;
    --strong: #059669; --amber: #d97706; --slate: #64748b; --one: #c4bfb9; --empty: #e7e5e4; --add: #ecfdf5; --add-fg: #065f46; --del: #fef2f2; --del-fg: #991b1b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #e7e5e4; --card: #1c1917; --line: #292524; --muted: #a8a29e; --quote: #141210; --accent: #34d399;
      --strong: #10b981; --amber: #f59e0b; --slate: #94a3b8; --one: #57534e; --empty: #292524; --add: #052e1f; --add-fg: #a7f3d0; --del: #2d0f0f; --del-fg: #fecaca; }
  }
  body { background: var(--bg); color: var(--fg); }
  .card { background: var(--card); border-color: var(--line); }
  .muted { color: var(--muted); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; }
  blockquote { background: var(--quote); border-left: 3px solid var(--line); overflow-wrap: anywhere; }
  .dot, .cell { display: inline-block; background: var(--empty); border-radius: 3px; }
  .dot { width: 12px; height: 12px; }
  .cell { width: 22px; height: 16px; }
  .hit-strong { background: var(--strong); }
  .hit-amber { background: var(--amber); }
  .hit-slate { background: var(--slate); }
  .hit-one { background: var(--one); }
  .diff-add { background: var(--add); color: var(--add-fg); overflow-wrap: anywhere; }
  .diff-del { background: var(--del); color: var(--del-fg); overflow-wrap: anywhere; }
  .ov-row { border-top: 1px solid var(--line); }
  .ov-home td { border-top: 1px solid var(--line); }
  .ov-link:hover { color: var(--accent); }
  .top { border-color: var(--accent); }
  a.accent { color: var(--accent); }
  summary { cursor: pointer; }
</style>
</head>
<body>
<main class="max-w-5xl mx-auto px-4 sm:px-6 py-12 space-y-12">
  <!-- REPORT -->
</main>
</body>
</html>
