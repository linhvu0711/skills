<meta charset="utf-8">
<title>Diagram</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eaeef2;
    --ink: #1a222d;
    --muted: #525d6c;
    --line: #cfd6df;
    --line-soft: #e3e8ee;
    --stroke: #3b4654;
    --edge: #4d5867;
    --accent: #0c6b76;
    --accent-soft: #d7eef0;
    --add: #1f8a4c;
    --add-soft: #dff3e6;
    --remove: #c43d36;
    --remove-soft: #f9e1df;
    --modify: #b06f0a;
    --modify-soft: #f8ecd2;
    --node: #ffffff;
    --group: rgba(12, 107, 118, 0.05);
    --lane: rgba(26, 34, 45, 0.035);
    --shadow: 0 1px 2px rgba(20, 30, 40, 0.08), 0 4px 14px rgba(20, 30, 40, 0.06);
    --font: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a;
      --surface: #161c24;
      --surface-2: #232b35;
      --ink: #e4e9ef;
      --muted: #9fabbb;
      --line: #2e3844;
      --line-soft: #252d38;
      --stroke: #8593a4;
      --edge: #8e9bab;
      --accent: #5cc6ce;
      --accent-soft: #163b40;
      --add: #4fc57d;
      --add-soft: #173726;
      --remove: #f0736b;
      --remove-soft: #47221f;
      --modify: #e2a63b;
      --modify-soft: #3f2f12;
      --node: #1e2630;
      --group: rgba(92, 198, 206, 0.07);
      --lane: rgba(228, 233, 239, 0.04);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141a;
    --surface: #161c24;
    --surface-2: #232b35;
    --ink: #e4e9ef;
    --muted: #9fabbb;
    --line: #2e3844;
    --line-soft: #252d38;
    --stroke: #8593a4;
    --edge: #8e9bab;
    --accent: #5cc6ce;
    --accent-soft: #163b40;
    --add: #4fc57d;
    --add-soft: #173726;
    --remove: #f0736b;
    --remove-soft: #47221f;
    --modify: #e2a63b;
    --modify-soft: #3f2f12;
    --node: #1e2630;
    --group: rgba(92, 198, 206, 0.07);
    --lane: rgba(228, 233, 239, 0.04);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr 320px;
    height: 100%;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .titles { min-width: 0; flex: 1 1 260px; }
  .titles h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .titles .q {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 4px 8px;
  }
  .search input {
    border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 13px; width: 150px; outline: none;
  }
  .search svg { width: 14px; height: 14px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg[hidden] { display: none; }
  .seg button {
    border: 0; background: var(--surface); color: var(--muted);
    font: inherit; font-size: 12.5px; font-weight: 500;
    padding: 5px 10px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 12.5px; font-weight: 500;
    padding: 5px 10px; border-radius: 6px; cursor: pointer; line-height: 1.2;
  }
  .btn:hover, .seg button:hover { background: var(--surface-2); }
  .btn:focus-visible, .seg button:focus-visible, .search:focus-within, .panel a:focus-visible, .panel button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .zoom { display: inline-flex; gap: 0; }
  .zoom .btn { border-radius: 0; padding: 5px 9px; min-width: 30px; }
  .zoom .btn:first-child { border-radius: 6px 0 0 6px; }
  .zoom .btn:last-child { border-radius: 0 6px 6px 0; }
  .zoom .btn + .btn { border-left: 0; }

  .stage { position: relative; overflow: hidden; background: var(--bg); }
  .stage svg.canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .stage svg.canvas.dragging { cursor: grabbing; }
  .legend {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    max-width: calc(100% - 24px);
    backdrop-filter: blur(4px);
  }
  .legend:empty { display: none; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 28px; height: 14px; overflow: visible; }
  .hint {
    position: absolute; right: 12px; bottom: 12px;
    font-size: 11.5px; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--line-soft); border-radius: 8px; padding: 5px 9px;
  }

  .panel {
    border-left: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 16px;
    font-size: 13px;
  }
  .panel h2 {
    margin: 0 0 4px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .panel h3 {
    margin: 18px 0 6px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .panel p { margin: 0 0 8px; }
  .panel .kind {
    display: inline-block; font-size: 11px; font-weight: 500; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-bottom: 8px;
  }
  .panel .chg { border-color: transparent; }
  .panel .chg.add { background: var(--add-soft); color: var(--add); }
  .panel .chg.remove { background: var(--remove-soft); color: var(--remove); }
  .panel .chg.modify { background: var(--modify-soft); color: var(--modify); }
  .panel code, .panel .path {
    font-family: var(--mono); font-size: 11.5px;
    background: var(--surface-2); border-radius: 4px; padding: 2px 5px;
    word-break: break-all;
  }
  .panel .path { display: block; padding: 6px 8px; margin: 4px 0; }
  .panel ol, .panel ul { margin: 0; padding-left: 18px; }
  .panel li { margin: 0 0 6px; }
  .panel ul.links { list-style: none; padding: 0; }
  .panel ul.links li { display: flex; gap: 6px; align-items: baseline; }
  .panel ul.links .verb { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .panel a, .panel button.link {
    color: var(--accent); background: none; border: 0; padding: 0;
    font: inherit; cursor: pointer; text-decoration: none; text-align: left;
  }
  .panel a:hover, .panel button.link:hover { text-decoration: underline; }
  .panel .back {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--muted); font-size: 12px; margin-bottom: 10px; cursor: pointer;
    background: none; border: 0; padding: 0; font-family: inherit;
  }
  .panel .back:hover { color: var(--ink); }
  .panel .finding { border-left: 3px solid var(--modify); padding-left: 10px; margin: 0 0 10px; }
  .panel .empty { color: var(--muted); }

  /* SVG */
  .canvas { font-family: var(--font); }
  .canvas text { fill: var(--ink); font-size: 12.5px; user-select: none; }
  .canvas .sub { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  .canvas .tag { fill: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .canvas .shape { fill: var(--node); stroke: var(--stroke); stroke-width: 1.3; }
  .canvas .n { cursor: pointer; }
  .canvas .n:focus { outline: none; }
  .canvas .n:focus-visible .shape, .canvas .n.selected .shape { stroke: var(--accent); stroke-width: 2; }
  .canvas .n.selected .shape { filter: drop-shadow(0 0 4px var(--accent)); }
  .canvas .n:hover .shape { stroke: var(--accent); }
  .canvas .n.external .shape { stroke-dasharray: 5 4; }
  .canvas .n.note .shape { fill: var(--surface-2); stroke: var(--line); }
  .canvas .n.note text { fill: var(--muted); font-style: italic; font-size: 11.5px; }
  .canvas .n.start .shape { fill: var(--stroke); }
  .canvas .n.end .core { fill: var(--stroke); }
  .canvas .n .head { fill: var(--node); stroke: var(--stroke); stroke-width: 1.3; }
  .canvas .n .band { fill: var(--surface-2); stroke: none; }
  .canvas .n .sep { stroke: var(--line); stroke-width: 1; }
  .canvas .n .row { font-size: 11px; font-family: var(--mono); }
  .canvas .n .face { fill: var(--surface-2); stroke: var(--stroke); stroke-width: 1.3; }
  .canvas .n .bar { stroke: var(--muted); stroke-width: 1; }
  .canvas .n .badge { font-size: 10px; font-weight: 700; }

  .canvas .g rect { fill: var(--group); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
  .canvas .g.zone rect { stroke-dasharray: none; }
  .canvas .g.lane rect { fill: var(--lane); stroke: var(--line-soft); stroke-dasharray: none; }
  .canvas .g text { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .canvas .g .gsub { text-transform: none; font-weight: 400; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0; }

  .canvas .e { cursor: pointer; }
  .canvas .e path.line { fill: none; stroke: var(--edge); stroke-width: 1.3; }
  .canvas .e path.hit { fill: none; stroke: transparent; stroke-width: 14; }
  .canvas .e.dashed path.line { stroke-dasharray: 6 4; }
  .canvas .e.dotted path.line { stroke-dasharray: 2 3; }
  .canvas .e text { font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .canvas .e:hover path.line, .canvas .e.hot path.line, .canvas .e.selected path.line { stroke: var(--accent); stroke-width: 2; }
  .canvas .e:hover text, .canvas .e.hot text, .canvas .e.selected text { fill: var(--accent); }

  .canvas .add .shape, .canvas .add .head, .canvas .add .face { stroke: var(--add); fill: var(--add-soft); }
  .canvas .add path.line { stroke: var(--add); }
  .canvas .add .badge { fill: var(--add); }
  .canvas .n.add.start .shape { fill: var(--add); }
  .canvas .modify .shape, .canvas .modify .head, .canvas .modify .face { stroke: var(--modify); fill: var(--modify-soft); }
  .canvas .modify path.line { stroke: var(--modify); }
  .canvas .modify .badge { fill: var(--modify); }
  .canvas .remove .shape, .canvas .remove .head, .canvas .remove .face { stroke: var(--remove); fill: var(--remove-soft); stroke-dasharray: 4 3; }
  .canvas .remove path.line { stroke: var(--remove); stroke-dasharray: 4 3; }
  .canvas .remove .badge { fill: var(--remove); }
  .canvas .remove > text.label { text-decoration: line-through; fill: var(--muted); }
  .canvas .n.hidden, .canvas .e.hidden, .canvas .g.hidden { display: none; }
  .canvas .dim { opacity: 0.28; }

  /* sequence */
  .canvas .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
  .canvas .act { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
  .canvas .frame rect { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .canvas .frame .ftag { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
  .canvas .frame text { font-size: 11px; font-weight: 600; fill: var(--muted); }
  .canvas .snote rect { fill: var(--surface-2); stroke: var(--line); }
  .canvas .snote text { font-size: 11px; fill: var(--muted); font-style: italic; }

  @media (prefers-reduced-motion: no-preference) {
    .canvas .n, .canvas .e, .canvas .g { transition: opacity 120ms ease; }
    #viewport { transition: transform 160ms ease; }
    #viewport.live { transition: none; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 38vh; }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
    .hint { display: none; }
    .search input { width: 110px; }
  }
</style>

<div class="app">
  <header>
    <div class="titles">
      <h1 id="title">Diagram</h1>
      <p class="q" id="question"></p>
    </div>
    <div class="tools">
      <label class="search" aria-label="Find a node">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Find node or file" autocomplete="off">
      </label>
      <div class="seg" id="modes" role="group" aria-label="View" hidden>
        <button data-mode="current" aria-pressed="false">Current</button>
        <button data-mode="planned" aria-pressed="false">Planned</button>
        <button data-mode="diff" aria-pressed="false">Diff</button>
      </div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button class="btn" id="zout" aria-label="Zoom out">&minus;</button>
        <button class="btn" id="zin" aria-label="Zoom in">+</button>
        <button class="btn" id="fit">Fit</button>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <svg class="canvas" id="canvas" role="img" aria-labelledby="title question">
      <defs id="defs"></defs>
      <g id="viewport"></g>
    </svg>
    <div class="legend" id="legend"></div>
    <div class="hint">Drag to pan &middot; Scroll to zoom &middot; Click a node</div>
  </div>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script>
/* DIAGRAM_DATA: replace this object. Schema: references/page.md in the diagram skill. */
const DATA = {};
</script>

<script>
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s) => document.querySelector(s);
  const svgEl = (name, attrs, parent) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs || {}) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const text = (parent, x, y, str, attrs) => {
    const t = svgEl('text', Object.assign({ x, y }, attrs || {}), parent);
    t.textContent = str;
    return t;
  };
  const lines = (s) => String(s == null ? '' : s).split('\n');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

  const D = DATA || {};
  const isSeq = D.type === 'sequence';
  const L = Object.assign(
    isSeq
      ? { colWidth: 190, rowHeight: 46, nodeWidth: 130, pad: 40 }
      : { colWidth: 320, rowHeight: 180, nodeWidth: 160, pad: 40 },
    D.layout || {}
  );

  const title = $('#title'), question = $('#question');
  title.textContent = D.title || 'Diagram';
  document.title = D.title || 'Diagram';
  question.textContent = [D.question, D.scope].filter(Boolean).join(' · ');

  const canvas = $('#canvas'), viewport = $('#viewport'), defs = $('#defs');
  const panel = $('#panel'), legendBox = $('#legend');

  // ---------- markers ----------
  const COLORS = { base: 'var(--edge)', accent: 'var(--accent)', add: 'var(--add)', remove: 'var(--remove)', modify: 'var(--modify)' };
  const HEADS = {
    arrow: (m, c) => svgEl('path', { d: 'M0,0 L10,5 L0,10 z', style: `fill:${c}` }, m),
    stick: (m, c) => svgEl('path', { d: 'M0,0 L10,5 L0,10', style: `fill:none;stroke:${c};stroke-width:1.5` }, m),
    open: (m, c) => svgEl('path', { d: 'M0,0 L10,5 L0,10 z', style: `fill:var(--node);stroke:${c};stroke-width:1.3` }, m),
    diamond: (m, c) => svgEl('path', { d: 'M0,5 L6,0 L12,5 L6,10 z', style: `fill:var(--node);stroke:${c};stroke-width:1.3` }, m),
    fdiamond: (m, c) => svgEl('path', { d: 'M0,5 L6,0 L12,5 L6,10 z', style: `fill:${c}` }, m),
    dot: (m, c) => svgEl('circle', { cx: 5, cy: 5, r: 3.5, style: `fill:${c}` }, m),
  };
  for (const h in HEADS) {
    for (const col in COLORS) {
      const wide = h === 'diamond' || h === 'fdiamond';
      const m = svgEl('marker', {
        id: `mk-${h}-${col}`, viewBox: wide ? '0 0 12 10' : '0 0 10 10',
        refX: wide ? 12 : 9.5, refY: 5, markerWidth: wide ? 12 : 9, markerHeight: 9,
        orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse',
      }, defs);
      HEADS[h](m, COLORS[col]);
    }
  }
  const markerUrl = (head, col) => (head && head !== 'none' ? `url(#mk-${head}-${col})` : null);

  // ---------- mode ----------
  const items = [].concat(D.nodes || [], D.edges || [], D.groups || [], D.participants || [], D.steps || [], D.frames || []);
  const hasChange = items.some((i) => i && i.change);
  let mode = hasChange ? (D.mode || 'diff') : 'current';
  const modesBox = $('#modes');
  if (hasChange) modesBox.hidden = false;
  const visibleIn = (item) => {
    if (!item || !item.change) return true;
    if (item.change === 'add') return mode !== 'current';
    if (item.change === 'remove') return mode !== 'planned';
    return true;
  };
  const changeClass = (item) => (item && item.change && mode !== 'current' ? ` ${item.change}` : '');

  // ---------- state ----------
  let selected = null;
  const nodeEls = new Map(), edgeEls = new Map(), groupEls = new Map();

  // ================= GRAPH =================
  const geo = new Map();
  function nodeSize(n) {
    const k = n.kind || 'box';
    const textW = Math.max(
      Math.max.apply(null, lines(n.label).map((s) => s.length)) * 7.2,
      (n.sub || '').length * 6.4,
      Math.max.apply(null, (n.sections || [[]]).flat().map((s) => s.length).concat(0)) * 6.6
    ) + 28;
    const autoW = Math.max(L.nodeWidth, Math.min(textW, L.colWidth - 24));
    const w = n.w || (k === 'actor' ? 70 : k === 'start' || k === 'end' ? 40 : k === 'decision' ? Math.max(120, autoW) : autoW);
    let h = n.h;
    if (!h) {
      const labelLines = lines(n.label).length;
      if (k === 'table') {
        const secs = n.sections || [];
        h = 30 + secs.reduce((a, s) => a + s.length * 17 + 8, 0);
        if (!secs.length) h = 34;
      } else if (k === 'actor') h = 74;
      else if (k === 'start' || k === 'end') h = 40;
      else if (k === 'decision') h = 76;
      else if (k === 'usecase') h = 62;
      else if (k === 'store') h = 66;
      else h = 40 + (labelLines - 1) * 15 + (n.sub ? 15 : 0) + (n.tag ? 12 : 0);
    }
    return { w, h };
  }
  function computeGeo() {
    (D.nodes || []).forEach((n) => {
      const { w, h } = nodeSize(n);
      const x = L.pad + (n.x || 0) * L.colWidth + (L.colWidth - w) / 2;
      const y = L.pad + (n.y || 0) * L.rowHeight + (L.rowHeight - h) / 2;
      geo.set(n.id, { x, y, w, h, cx: x + w / 2, cy: y + h / 2 });
    });
  }

  function drawNode(n, parent) {
    const g = geo.get(n.id);
    const k = n.kind || 'box';
    const el = svgEl('g', {
      class: `n ${k}${changeClass(n)}`, transform: `translate(${g.x},${g.y})`,
      tabindex: 0, role: 'button', 'aria-label': `${lines(n.label).join(' ')}${n.sub ? ', ' + n.sub : ''}`,
    }, parent);
    const { w, h } = g;
    let labelY = h / 2 + 4;
    if (k === 'box' || k === 'external' || k === 'component' || k === 'container') svgEl('rect', { class: 'shape', width: w, height: h, rx: 6 }, el);
    else if (k === 'rounded') svgEl('rect', { class: 'shape', width: w, height: h, rx: 14 }, el);
    else if (k === 'note') svgEl('path', { class: 'shape', d: `M0,0 H${w - 12} L${w},12 V${h} H0 z M${w - 12},0 V12 H${w}` }, el);
    else if (k === 'file') svgEl('path', { class: 'shape', d: `M0,0 H${w - 14} L${w},14 V${h} H0 z M${w - 14},0 V14 H${w}` }, el);
    else if (k === 'decision') svgEl('polygon', { class: 'shape', points: `${w / 2},0 ${w},${h / 2} ${w / 2},${h} 0,${h / 2}` }, el);
    else if (k === 'usecase') svgEl('ellipse', { class: 'shape', cx: w / 2, cy: h / 2, rx: w / 2, ry: h / 2 }, el);
    else if (k === 'start') { svgEl('circle', { class: 'shape', cx: w / 2, cy: h / 2, r: 13 }, el); labelY = h + 16; }
    else if (k === 'end') { svgEl('circle', { class: 'shape', cx: w / 2, cy: h / 2, r: 15 }, el); svgEl('circle', { class: 'core', cx: w / 2, cy: h / 2, r: 9 }, el); labelY = h + 16; }
    else if (k === 'store') {
      const ry = 8;
      svgEl('path', { class: 'shape', d: `M0,${ry} A${w / 2},${ry} 0 0 1 ${w},${ry} V${h - ry} A${w / 2},${ry} 0 0 1 0,${h - ry} z` }, el);
      svgEl('path', { class: 'shape', d: `M0,${ry} A${w / 2},${ry} 0 0 0 ${w},${ry}`, style: 'fill:none' }, el);
      labelY = h / 2 + 8;
    } else if (k === 'queue') {
      svgEl('rect', { class: 'shape', width: w, height: h, rx: 4 }, el);
      [10, 16, 22].forEach((x) => svgEl('line', { class: 'bar', x1: x, y1: 8, x2: x, y2: h - 8 }, el));
    } else if (k === 'device') {
      const o = 8;
      svgEl('path', { class: 'face', d: `M${o},0 H${w} L${w - o},${o} H0 z` }, el);
      svgEl('path', { class: 'face', d: `M${w},0 V${h - o} L${w - o},${h} V${o} z` }, el);
      svgEl('rect', { class: 'shape', y: o, width: w - o, height: h - o }, el);
      labelY = h / 2 + 8;
    } else if (k === 'actor') {
      const cx = w / 2;
      svgEl('circle', { class: 'head', cx, cy: 12, r: 8 }, el);
      svgEl('path', { class: 'shape', d: `M${cx},20 V40 M${cx - 14},27 H${cx + 14} M${cx},40 L${cx - 11},56 M${cx},40 L${cx + 11},56`, style: 'fill:none;stroke-width:1.6;stroke-linecap:round' }, el);
      labelY = 70;
    } else if (k === 'table') {
      svgEl('rect', { class: 'shape', width: w, height: h, rx: 4 }, el);
      svgEl('rect', { class: 'band', x: 1, y: 1, width: w - 2, height: 26, rx: 3 }, el);
      text(el, w / 2, 18, lines(n.label)[0], { 'text-anchor': 'middle', class: 'label', style: 'font-weight:600' });
      let y = 30;
      (n.sections || []).forEach((sec, i) => {
        if (i > 0) svgEl('line', { class: 'sep', x1: 0, y1: y - 2, x2: w, y2: y - 2 }, el);
        sec.forEach((row) => { y += 15; text(el, 8, y, row, { class: 'row' }); });
        y += 8;
      });
      labelY = null;
    } else svgEl('rect', { class: 'shape', width: w, height: h, rx: 6 }, el);

    if (k === 'component' || k === 'container' || n.tag) {
      text(el, 8, 12, n.tag || k, { class: 'tag' });
      if (labelY !== null && labelY === h / 2 + 4) labelY = h / 2 + 8;
    }
    if (labelY !== null) {
      const ls = lines(n.label);
      const start = labelY - ((ls.length - 1) * 15) / 2 - (n.sub && k !== 'start' && k !== 'end' && k !== 'actor' ? 7 : 0);
      const t = text(el, w / 2, start, '', { 'text-anchor': 'middle', class: 'label', style: 'font-weight:500' });
      ls.forEach((ln, i) => { const ts = svgEl('tspan', { x: w / 2, dy: i ? 15 : 0 }, t); ts.textContent = ln; });
      if (n.sub) text(el, w / 2, start + (ls.length - 1) * 15 + 15, n.sub, { 'text-anchor': 'middle', class: 'sub' });
    }
    if (n.change && mode !== 'current') {
      const sym = n.change === 'add' ? '+' : n.change === 'remove' ? '−' : '~';
      text(el, w - 4, 11, sym, { class: 'badge', 'text-anchor': 'end' });
    }
    const pick = () => { if (n.href) window.open(n.href, '_blank', 'noopener'); else select({ type: 'node', item: n }); };
    el.addEventListener('click', (e) => { e.stopPropagation(); pick(); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    el.addEventListener('mouseenter', () => hover(n.id, true));
    el.addEventListener('mouseleave', () => hover(n.id, false));
    nodeEls.set(n.id, el);
  }

  function anchor(a, b, offset) {
    const dx = b.cx - a.cx, dy = b.cy - a.cy;
    if (Math.abs(dx) * a.h >= Math.abs(dy) * a.w) {
      const s = dx >= 0 ? 1 : -1;
      return { x: a.cx + s * a.w / 2, y: a.cy + offset, dx: s, dy: 0 };
    }
    const s = dy >= 0 ? 1 : -1;
    return { x: a.cx + offset, y: a.cy + s * a.h / 2, dx: 0, dy: s };
  }
  function bezier(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return {
      x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
      y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y,
    };
  }
  function edgePath(e, idx, count) {
    const a = geo.get(e.from), b = geo.get(e.to);
    if (!a || !b) return null;
    if (e.from === e.to) {
      const x = a.x + a.w, y = a.cy - 12;
      return { d: `M${x},${y} C${x + 50},${y - 30} ${x + 50},${y + 54} ${x},${y + 24}`, mid: { x: x + 40, y: y + 12 } };
    }
    const lane = idx - (count - 1) / 2;
    const off = lane * 18;
    const p0 = anchor(a, b, off), p3 = anchor(b, a, off);
    const dist = Math.hypot(p3.x - p0.x, p3.y - p0.y);
    const k = Math.max(36, Math.min(120, dist / 2.6));
    const p1 = { x: p0.x + p0.dx * k, y: p0.y + p0.dy * k };
    const p2 = { x: p3.x + p3.dx * k, y: p3.y + p3.dy * k };
    const mid = bezier(p0, p1, p2, p3, 0.5 + lane * 0.3);
    const flat = Math.abs(p3.y - p0.y) < 30, steep = Math.abs(p3.x - p0.x) < 30;
    return {
      d: `M${p0.x},${p0.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`,
      mid, flat, steep,
    };
  }
  function drawEdge(e, parent, idx, count) {
    const p = edgePath(e, idx, count);
    if (!p) return;
    const col = e.change && mode !== 'current' ? e.change : 'base';
    const el = svgEl('g', { class: `e ${e.kind || 'solid'}${changeClass(e)}`, 'data-from': e.from, 'data-to': e.to }, parent);
    svgEl('path', { class: 'hit', d: p.d }, el);
    const head = e.head === undefined ? 'arrow' : e.head;
    const line = svgEl('path', { class: 'line', d: p.d, 'marker-end': markerUrl(head, col), 'marker-start': markerUrl(e.tail, col) }, el);
    if (e.label) {
      if (p.flat) text(el, p.mid.x, p.mid.y - 7, e.label, { 'text-anchor': 'middle' });
      else if (p.steep) text(el, p.mid.x + 8, p.mid.y + 4, e.label, { 'text-anchor': 'start' });
      else text(el, p.mid.x, p.mid.y + 4, e.label, { 'text-anchor': 'middle' });
    }
    el._line = line; el._head = head; el._tail = e.tail; el._col = col;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); select({ type: 'edge', item: e }); });
    el.addEventListener('mouseenter', () => setEdgeColor(el, 'accent'));
    el.addEventListener('mouseleave', () => { if (!el.classList.contains('hot') && !el.classList.contains('selected')) setEdgeColor(el, el._col); });
    edgeEls.set(e, el);
  }
  function setEdgeColor(el, col) {
    el._line.setAttribute('marker-end', markerUrl(el._head, col) || '');
    if (el._tail) el._line.setAttribute('marker-start', markerUrl(el._tail, col) || '');
  }

  const groupBox = new Map();
  function bboxOf(gr, seen) {
    if (groupBox.has(gr.id)) return groupBox.get(gr.id);
    seen = seen || new Set(); seen.add(gr.id);
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    (gr.members || []).forEach((id) => {
      let r = geo.get(id);
      if (!r) {
        const sub = (D.groups || []).find((g) => g.id === id);
        if (sub && !seen.has(id)) { const b = bboxOf(sub, seen); r = b && { x: b.x, y: b.y, w: b.w, h: b.h }; }
      }
      if (!r) return;
      x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h);
    });
    if (x1 === Infinity) return null;
    const pad = gr.pad == null ? 22 : gr.pad;
    const b = { x: x1 - pad, y: y1 - pad - 14, w: x2 - x1 + pad * 2, h: y2 - y1 + pad * 2 + 14 };
    groupBox.set(gr.id, b);
    return b;
  }
  function drawGroup(gr, parent) {
    const b = bboxOf(gr);
    if (!b) return;
    const el = svgEl('g', { class: `g ${gr.kind || 'boundary'}${changeClass(gr)}` }, parent);
    svgEl('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 8 }, el);
    text(el, b.x + 10, b.y + 16, gr.label || '', {});
    if (gr.sub) text(el, b.x + b.w - 10, b.y + 16, gr.sub, { class: 'gsub', 'text-anchor': 'end' });
    groupEls.set(gr.id, el);
  }

  function renderGraph() {
    viewport.innerHTML = '';
    nodeEls.clear(); edgeEls.clear(); groupEls.clear(); groupBox.clear();
    computeGeo();
    const gl = svgEl('g', { class: 'groups' }, viewport);
    const elg = svgEl('g', { class: 'edges' }, viewport);
    const nl = svgEl('g', { class: 'nodes' }, viewport);
    const order = (D.groups || []).slice().sort((a, b) => (a.members || []).length > (b.members || []).length ? -1 : 1);
    order.forEach((g) => drawGroup(g, gl));
    (D.nodes || []).forEach((n) => drawNode(n, nl));
    const pairs = new Map();
    (D.edges || []).forEach((e) => { const k = [e.from, e.to].sort().join('|'); pairs.set(k, (pairs.get(k) || []).concat(e)); });
    (D.edges || []).forEach((e) => {
      const k = [e.from, e.to].sort().join('|'); const arr = pairs.get(k);
      drawEdge(e, elg, arr.indexOf(e), arr.length);
    });
    applyMode();
  }

  // ================= SEQUENCE =================
  const seqX = new Map();
  let seqTop = 0;
  function renderSequence() {
    viewport.innerHTML = '';
    nodeEls.clear(); edgeEls.clear(); groupEls.clear();
    const parts = D.participants || [], steps = D.steps || [];
    const fl = svgEl('g', { class: 'frames' }, viewport);
    const ll = svgEl('g', { class: 'lifelines' }, viewport);
    const pl = svgEl('g', { class: 'nodes' }, viewport);
    const ml = svgEl('g', { class: 'edges' }, viewport);
    const headH = 44;
    seqTop = L.pad + headH + 30;
    const bottom = seqTop + steps.length * L.rowHeight + 20;
    parts.forEach((p, i) => {
      const cx = L.pad + i * L.colWidth + L.colWidth / 2;
      seqX.set(p.id, cx);
      svgEl('line', { class: 'life', x1: cx, y1: L.pad + headH, x2: cx, y2: bottom }, ll);
      const w = p.w || L.nodeWidth, k = p.kind || 'box';
      const el = svgEl('g', { class: `n ${k}${changeClass(p)}`, transform: `translate(${cx - w / 2},${L.pad})`, tabindex: 0, role: 'button', 'aria-label': p.label }, pl);
      if (k === 'actor') {
        svgEl('circle', { class: 'head', cx: w / 2, cy: 9, r: 7 }, el);
        svgEl('path', { class: 'shape', d: `M${w / 2},16 V30 M${w / 2 - 11},22 H${w / 2 + 11} M${w / 2},30 L${w / 2 - 9},42 M${w / 2},30 L${w / 2 + 9},42`, style: 'fill:none;stroke-width:1.5;stroke-linecap:round' }, el);
        text(el, w / 2, 56, p.label, { 'text-anchor': 'middle', class: 'label', style: 'font-weight:500' });
      } else if (k === 'store') {
        svgEl('path', { class: 'shape', d: `M0,7 A${w / 2},7 0 0 1 ${w},7 V${headH - 7} A${w / 2},7 0 0 1 0,${headH - 7} z` }, el);
        svgEl('path', { class: 'shape', d: `M0,7 A${w / 2},7 0 0 0 ${w},7`, style: 'fill:none' }, el);
        text(el, w / 2, headH / 2 + 8, p.label, { 'text-anchor': 'middle', class: 'label', style: 'font-weight:500' });
      } else {
        svgEl('rect', { class: 'shape', width: w, height: headH, rx: 6 }, el);
        text(el, w / 2, headH / 2 + (p.sub ? 0 : 4), p.label, { 'text-anchor': 'middle', class: 'label', style: 'font-weight:500' });
        if (p.sub) text(el, w / 2, headH / 2 + 15, p.sub, { 'text-anchor': 'middle', class: 'sub' });
      }
      const pick = () => select({ type: 'node', item: p });
      el.addEventListener('click', (e) => { e.stopPropagation(); pick(); });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      nodeEls.set(p.id, el);
    });
    (D.frames || []).forEach((f) => {
      const cols = (f.participants || parts.map((p) => p.id)).map((id) => seqX.get(id)).filter((x) => x != null);
      if (!cols.length) return;
      const x1 = Math.min.apply(null, cols) - L.colWidth / 2 + 14, x2 = Math.max.apply(null, cols) + L.colWidth / 2 - 14;
      const y1 = seqTop + f.from * L.rowHeight - L.rowHeight * 0.95, y2 = seqTop + f.to * L.rowHeight + L.rowHeight * 0.4;
      const el = svgEl('g', { class: `frame${changeClass(f)}` }, fl);
      svgEl('rect', { x: x1, y: y1, width: x2 - x1, height: y2 - y1, rx: 4 }, el);
      const t = text(el, x1 + 8, y1 + 13, f.label || '', {});
      const bb = t.getBBox();
      el.insertBefore(svgEl('rect', { class: 'ftag', x: x1, y: y1, width: bb.width + 16, height: 18, rx: 4 }), t);
      if (f.note) text(el, x2 - 8, y1 + 13, f.note, { 'text-anchor': 'end', class: 'sub' });
    });
    steps.forEach((s, i) => {
      const y = seqTop + i * L.rowHeight;
      const xa = seqX.get(s.from), xb = seqX.get(s.to);
      if (xa == null || xb == null) return;
      const col = s.change && mode !== 'current' ? s.change : 'base';
      const kind = s.kind || 'sync';
      const cls = kind === 'return' ? 'dashed' : 'solid';
      const el = svgEl('g', { class: `e ${cls}${changeClass(s)}`, 'data-from': s.from, 'data-to': s.to }, ml);
      const head = kind === 'sync' ? 'arrow' : 'stick';
      let d, lx, ly;
      if (s.from === s.to) {
        d = `M${xa},${y - 10} H${xa + 40} V${y + 12} H${xa + 4}`;
        lx = xa + 48; ly = y + 4;
        text(el, lx, ly, s.label || '', {});
      } else {
        const dir = xb > xa ? 1 : -1;
        d = `M${xa},${y} H${xb - dir * 3}`;
        lx = (xa + xb) / 2; ly = y - 6;
        text(el, lx, ly, s.label || '', { 'text-anchor': 'middle' });
        if (kind === 'sync') {
          svgEl('rect', { class: 'act', x: xb - 4, y: y - 2, width: 8, height: L.rowHeight * 0.55, rx: 1 }, ll);
        }
      }
      svgEl('path', { class: 'hit', d }, el);
      const line = svgEl('path', { class: 'line', d, 'marker-end': markerUrl(head, col) }, el);
      el.insertBefore(line, el.firstChild.nextSibling);
      el._line = line; el._head = head; el._col = col;
      if (s.change && mode !== 'current') {
        const sym = s.change === 'add' ? '+' : s.change === 'remove' ? '−' : '~';
        text(el, Math.min(xa, xb) - 14, y + 4, sym, { class: 'badge', 'text-anchor': 'end' });
      }
      el.addEventListener('click', (ev) => { ev.stopPropagation(); select({ type: 'edge', item: s, index: i }); });
      el.addEventListener('mouseenter', () => setEdgeColor(el, 'accent'));
      el.addEventListener('mouseleave', () => { if (!el.classList.contains('selected')) setEdgeColor(el, el._col); });
      edgeEls.set(s, el);
    });
    (D.notes || []).forEach((nt) => {
      const x = seqX.get(nt.at); if (x == null) return;
      const y = seqTop + (nt.after == null ? -1 : nt.after) * L.rowHeight + L.rowHeight * 0.45;
      const el = svgEl('g', { class: `snote${changeClass(nt)}` }, ml);
      const t = text(el, x + 18, y + 13, nt.text || '', {});
      const bb = t.getBBox();
      el.insertBefore(svgEl('rect', { x: x + 12, y, width: bb.width + 12, height: 20, rx: 3 }), t);
    });
    applyMode();
  }

  // ---------- mode + visibility ----------
  function applyMode() {
    modesBox.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    const hiddenNodes = new Set();
    nodeEls.forEach((el, id) => {
      const item = (D.nodes || D.participants || []).find((n) => n.id === id);
      const v = visibleIn(item);
      el.classList.toggle('hidden', !v);
      if (!v) hiddenNodes.add(id);
    });
    edgeEls.forEach((el, e) => {
      const v = visibleIn(e) && !hiddenNodes.has(e.from) && !hiddenNodes.has(e.to);
      el.classList.toggle('hidden', !v);
    });
    groupEls.forEach((el, id) => {
      const gr = (D.groups || []).find((g) => g.id === id);
      el.classList.toggle('hidden', !visibleIn(gr));
    });
  }
  modesBox.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode;
    render();
    if (selected) select(selected, true);
  });

  // ---------- hover / search / select ----------
  function hover(id, on) {
    if (searchTerm) return;
    edgeEls.forEach((el, e) => {
      const touch = e.from === id || e.to === id;
      el.classList.toggle('hot', on && touch);
      el.classList.toggle('dim', on && !touch);
      if (on && touch) setEdgeColor(el, 'accent'); else if (!el.classList.contains('selected')) setEdgeColor(el, el._col);
    });
    const near = new Set([id]);
    if (on) edgeEls.forEach((el, e) => { if (e.from === id) near.add(e.to); if (e.to === id) near.add(e.from); });
    nodeEls.forEach((el, nid) => el.classList.toggle('dim', on && !near.has(nid)));
  }
  let searchTerm = '';
  $('#search').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    const list = D.nodes || D.participants || [];
    const hit = new Set();
    if (searchTerm) list.forEach((n) => {
      const hay = [n.label, n.sub, n.path, n.tag, (n.sections || []).flat().join(' ')].join(' ').toLowerCase();
      if (hay.includes(searchTerm)) hit.add(n.id);
    });
    nodeEls.forEach((el, id) => el.classList.toggle('dim', !!searchTerm && !hit.has(id)));
    edgeEls.forEach((el, e) => el.classList.toggle('dim', !!searchTerm && !(hit.has(e.from) || hit.has(e.to))));
  });
  function select(sel, silent) {
    selected = sel;
    nodeEls.forEach((el) => el.classList.remove('selected'));
    edgeEls.forEach((el) => { el.classList.remove('selected'); setEdgeColor(el, el._col); });
    if (sel && sel.type === 'node') { const el = nodeEls.get(sel.item.id); if (el) el.classList.add('selected'); }
    if (sel && sel.type === 'edge') { const el = edgeEls.get(sel.item); if (el) { el.classList.add('selected'); setEdgeColor(el, 'accent'); } }
    renderPanel();
  }
  canvas.addEventListener('click', () => select(null));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });

  // ---------- panel ----------
  const chg = (item) => item && item.change ? `<span class="kind chg ${item.change}">${item.change === 'add' ? 'added by plan' : item.change === 'remove' ? 'removed by plan' : 'changed by plan'}</span> ` : '';
  const pathHtml = (p) => p ? [].concat(p).map((x) => `<span class="path">${esc(x)}</span>`).join('') : '';
  const nodeLink = (id) => {
    const n = (D.nodes || D.participants || []).find((x) => x.id === id);
    return n ? `<button class="link" data-node="${esc(id)}">${esc(lines(n.label).join(' '))}</button>` : esc(id);
  };
  function renderPanel() {
    if (!selected) {
      const guide = (D.guide || []).map((g) => `<li>${esc(g)}</li>`).join('');
      const findings = (D.findings || []).map((f) => `<p class="finding">${linkify(f)}</p>`).join('');
      panel.innerHTML = `
        <h2>${esc(D.title || 'Diagram')}</h2>
        ${D.question ? `<p>${esc(D.question)}</p>` : ''}
        ${D.scope ? `<p class="empty">${esc(D.scope)}</p>` : ''}
        ${guide ? `<h3>How to read it</h3><ol>${guide}</ol>` : ''}
        ${findings ? `<h3>Worth knowing</h3>${findings}` : ''}
        ${!guide && !findings ? '<p class="empty">Click a node or an arrow to see where it lives in the code.</p>' : ''}`;
      return;
    }
    const it = selected.item;
    if (selected.type === 'node') {
      const outs = [], ins = [];
      const list = isSeq ? (D.steps || []) : (D.edges || []);
      list.forEach((e) => {
        if (!visibleIn(e)) return;
        if (e.from === it.id && e.to !== it.id) outs.push(`<li><span class="verb">${esc(e.label || '→')}</span>${nodeLink(e.to)}</li>`);
        if (e.to === it.id && e.from !== it.id) ins.push(`<li>${nodeLink(e.from)}<span class="verb">${esc(e.label || '→')}</span></li>`);
      });
      const rows = (it.sections || []).map((s) => `<ul>${s.map((r) => `<li><code>${esc(r)}</code></li>`).join('')}</ul>`).join('');
      panel.innerHTML = `
        <button class="back" id="back">&larr; Overview</button>
        <h2>${esc(lines(it.label).join(' '))}</h2>
        <span class="kind">${esc(it.tag || it.kind || 'node')}</span> ${chg(it)}
        ${it.sub ? `<p class="empty">${esc(it.sub)}</p>` : ''}
        ${it.note ? `<p>${linkify(it.note)}</p>` : ''}
        ${it.path ? `<h3>In the code</h3>${pathHtml(it.path)}` : ''}
        ${rows ? `<h3>Members</h3>${rows}` : ''}
        ${outs.length ? `<h3>Out</h3><ul class="links">${outs.join('')}</ul>` : ''}
        ${ins.length ? `<h3>In</h3><ul class="links">${ins.join('')}</ul>` : ''}`;
    } else {
      panel.innerHTML = `
        <button class="back" id="back">&larr; Overview</button>
        <h2>${esc(it.label || 'Link')}</h2>
        <span class="kind">${esc(it.kind || 'edge')}</span> ${chg(it)}
        <p>${nodeLink(it.from)} <span class="empty">&rarr;</span> ${nodeLink(it.to)}</p>
        ${it.note ? `<p>${linkify(it.note)}</p>` : ''}
        ${it.path ? `<h3>In the code</h3>${pathHtml(it.path)}` : ''}`;
    }
    const back = $('#back'); if (back) back.addEventListener('click', () => select(null));
    panel.querySelectorAll('[data-node]').forEach((b) => b.addEventListener('click', () => {
      const n = (D.nodes || D.participants || []).find((x) => x.id === b.dataset.node);
      if (n) { select({ type: 'node', item: n }); focusNode(n.id); }
    }));
  }

  // ---------- legend ----------
  function renderLegend() {
    const rows = (D.legend || []).slice();
    if (hasChange) rows.push({ mark: 'add', label: 'Added by plan' }, { mark: 'modify', label: 'Changed by plan' }, { mark: 'remove', label: 'Removed by plan' });
    legendBox.innerHTML = rows.map((r) => {
      let sw = '';
      const m = r.mark || 'solid';
      if (m === 'solid') sw = '<line x1="0" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="1.5"/><path d="M22,3 L28,7 L22,11 z" fill="currentColor"/>';
      else if (m === 'dashed') sw = '<line x1="0" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/><path d="M22,3 L28,7 L22,11" fill="none" stroke="currentColor" stroke-width="1.5"/>';
      else if (m === 'dotted') sw = '<line x1="0" y1="7" x2="26" y2="7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>';
      else if (m === 'open') sw = '<line x1="0" y1="7" x2="18" y2="7" stroke="currentColor" stroke-width="1.5"/><path d="M18,2 L28,7 L18,12 z" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/>';
      else if (m === 'diamond') sw = '<line x1="0" y1="7" x2="16" y2="7" stroke="currentColor" stroke-width="1.5"/><path d="M16,7 L22,2 L28,7 L22,12 z" fill="var(--surface)" stroke="currentColor" stroke-width="1.3"/>';
      else if (m === 'fdiamond') sw = '<line x1="0" y1="7" x2="16" y2="7" stroke="currentColor" stroke-width="1.5"/><path d="M16,7 L22,2 L28,7 L22,12 z" fill="currentColor"/>';
      else if (m === 'external') sw = '<rect x="1" y="1" width="26" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>';
      else if (m === 'box') sw = '<rect x="1" y="1" width="26" height="12" rx="3" fill="var(--node)" stroke="currentColor" stroke-width="1.3"/>';
      else if (m === 'group') sw = '<rect x="1" y="1" width="26" height="12" rx="3" fill="var(--group)" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>';
      else if (m === 'add' || m === 'modify' || m === 'remove') sw = `<rect x="1" y="1" width="26" height="12" rx="3" fill="var(--${m}-soft)" stroke="var(--${m})" stroke-width="1.4"${m === 'remove' ? ' stroke-dasharray="4 3"' : ''}/>`;
      else sw = `<rect x="1" y="1" width="26" height="12" rx="3" fill="${esc(m)}"/>`;
      return `<span class="item"><svg viewBox="0 0 28 14" aria-hidden="true">${sw}</svg>${esc(r.label)}</span>`;
    }).join('');
  }

  // ---------- pan / zoom ----------
  let tx = 0, ty = 0, sc = 1;
  const apply = () => viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${sc})`);
  function fit() {
    const bb = viewport.getBBox();
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!bb.width || !bb.height || !W || !H) return;
    const m = 32;
    sc = Math.min((W - m * 2) / bb.width, (H - m * 2) / bb.height, 1.4);
    tx = (W - bb.width * sc) / 2 - bb.x * sc;
    ty = (H - bb.height * sc) / 2 - bb.y * sc;
    apply();
  }
  function zoomAt(f, px, py) {
    const ns = Math.max(0.2, Math.min(4, sc * f));
    tx = px - (px - tx) * (ns / sc); ty = py - (py - ty) * (ns / sc); sc = ns; apply();
  }
  function focusNode(id) {
    const g = geo.get(id);
    if (!g) return;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    tx = W / 2 - g.cx * sc; ty = H / 2 - g.cy * sc; apply();
  }
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    viewport.classList.add('live');
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false, id: e.pointerId };
    viewport.classList.add('live');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 3) {
      drag.moved = true; canvas.classList.add('dragging');
      try { canvas.setPointerCapture(drag.id); } catch (_) {}
    }
    if (!drag.moved) return;
    tx = drag.tx + dx; ty = drag.ty + dy; apply();
  });
  const endDrag = (e) => {
    if (!drag) return;
    if (drag.moved) { const stop = (ev) => { ev.stopPropagation(); canvas.removeEventListener('click', stop, true); }; canvas.addEventListener('click', stop, true); }
    drag = null; canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  $('#zin').addEventListener('click', () => { viewport.classList.remove('live'); zoomAt(1.25, canvas.clientWidth / 2, canvas.clientHeight / 2); });
  $('#zout').addEventListener('click', () => { viewport.classList.remove('live'); zoomAt(0.8, canvas.clientWidth / 2, canvas.clientHeight / 2); });
  $('#fit').addEventListener('click', () => { viewport.classList.remove('live'); fit(); });
  window.addEventListener('resize', fit);

  // ---------- boot ----------
  function render() { if (isSeq) renderSequence(); else renderGraph(); }
  render();
  renderLegend();
  renderPanel();
  requestAnimationFrame(fit);
})();
</script>
